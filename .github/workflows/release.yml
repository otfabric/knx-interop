name: Release
run-name: "Release ${{ inputs.bump && format('({0}) from {1}', inputs.bump, github.ref_name) || github.ref_name }}"

# For a tag vX.Y.Z equal to interop_version: build the MIT-licensed adapter
# images natively on amd64 and arm64, push them to GHCR as one multi-arch
# tag, and create the GitHub release with the RELEASE.md section. The
# images that redistribute GPL binaries (calimero-server, calimero-tools,
# knxd) are not published (THIRD_PARTY_NOTICES.md).

# Tag push: publish that tag. Manual run: bump the latest vX.Y.Z tag (patch by
# default) and publish that from main; the git tag is created with the GitHub
# release, its last step, so a failed run leaves no tag behind.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment from the latest vX.Y.Z tag
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  BASE_REGISTRY: mirror.gcr.io/library
  PUBLISHED: "xknx knxultimate probe"

jobs:
  # The tag to release. Fails before anything is built when the commit is not
  # ready for it: versions.yaml and RELEASE.md must already name that version.
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
              echo "::error::Releases are only allowed from ${DEFAULT_BRANCH}, not ${REF_NAME}"
              exit 1
            fi
            tag="$(scripts/next-version.sh "${BUMP}")"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} already exists"
              exit 1
            fi
          else
            tag="${REF_NAME}"
          fi
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::${tag} is not vX.Y.Z"; exit 1; }
          grep -qF "interop_version: \"${tag#v}\"" versions.yaml \
            || { echo "::error::versions.yaml does not say interop_version: \"${tag#v}\""; exit 1; }
          scripts/release-notes.sh "${tag}" > /dev/null \
            || { echo "::error::RELEASE.md has no notes for ${tag}"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "releasing ${tag} (from ${EVENT_NAME})"

  images:
    name: Images (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag equals interop_version
        run: |
          v=$(sed -nE 's/^interop_version: "([^"]+)".*/\1/p' versions.yaml)
          [ "v$v" = "${TAG}" ] || { echo "tag ${TAG} but interop_version $v"; exit 1; }
      - name: Build and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for a in $PUBLISHED; do
            t=ghcr.io/otfabric/knx-interop-$a:${TAG#v}-${{ matrix.arch }}
            docker build --build-arg BASE_REGISTRY=$BASE_REGISTRY -f adapters/$a/Dockerfile -t $t adapters
            docker push $t
          done

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Multi-arch tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          v=${TAG#v}
          for a in $PUBLISHED; do
            i=ghcr.io/otfabric/knx-interop-$a
            docker buildx imagetools create -t $i:$v $i:$v-amd64 $i:$v-arm64
            docker buildx imagetools inspect $i:$v | head -3
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/release-notes.sh "${TAG}" > notes.md && test -s notes.md
          gh release create "${TAG}" --title "knx-interop ${TAG}" --target "${GITHUB_SHA}" --notes-file notes.md
