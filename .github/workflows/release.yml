name: Release
run-name: "Release ${{ inputs.bump && format('({0}) from {1}', inputs.bump, github.ref_name) || github.ref_name }}"

# For a tag vX.Y.Z equal to interop_version: build the published adapter
# images natively on amd64 and arm64, smoke-test them there, push them to
# GHCR and record each push's digest, join the two digests of each image into
# one multi-arch tag, and create the GitHub release with the RELEASE.md
# section and manifest.json (every image by digest, the upstream versions).
# A missing digest stops the release before anything is tagged. The images
# that redistribute GPL binaries (calimero-server, calimero-tools, knxd) are
# not published (THIRD_PARTY_NOTICES.md; versions.yaml `published`).

# Tag push: publish that tag. Manual run: bump the latest vX.Y.Z tag (patch by
# default) and publish that from main; the git tag is created with the GitHub
# release, its last step, so a failed run leaves no tag behind.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment from the latest vX.Y.Z tag
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  BASE_REGISTRY: mirror.gcr.io/library
  PUBLISHED: "xknx knxultimate cbsigma probe"

jobs:
  # The tag to release. Fails before anything is built when the commit is not
  # ready for it: versions.yaml and RELEASE.md must already name that version.
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
              echo "::error::Releases are only allowed from ${DEFAULT_BRANCH}, not ${REF_NAME}"
              exit 1
            fi
            tag="$(scripts/next-version.sh "${BUMP}")"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::tag ${tag} already exists"
              exit 1
            fi
          else
            tag="${REF_NAME}"
          fi
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::${tag} is not vX.Y.Z"; exit 1; }
          grep -qF "interop_version: \"${tag#v}\"" versions.yaml \
            || { echo "::error::versions.yaml does not say interop_version: \"${tag#v}\""; exit 1; }
          [ -n "$(scripts/release-notes.sh "${tag}")" ] \
            || { echo "::error::RELEASE.md has no notes for ${tag}"; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "releasing ${tag} (from ${EVENT_NAME})"

  images:
    name: Images (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag equals interop_version
        run: |
          v=$(sed -nE 's/^interop_version: "([^"]+)".*/\1/p' versions.yaml)
          [ "v$v" = "${TAG}" ] || { echo "tag ${TAG} but interop_version $v"; exit 1; }
      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for a in $PUBLISHED; do
            t=ghcr.io/otfabric/knx-interop-$a:${TAG#v}-${ARCH}
            docker build --build-arg BASE_REGISTRY=$BASE_REGISTRY -f adapters/$a/Dockerfile -t $t adapters
          done
      # The images this release publishes pass the container-contract smoke
      # test on this architecture before any of them is pushed.
      - name: Smoke test
        env:
          ARCH: ${{ matrix.arch }}
        run: make smoke ADAPTERS="${PUBLISHED}" REGISTRY=ghcr.io/otfabric VERSION="${TAG#v}-${ARCH}"
      - name: Push and record the digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p digests
          : > "digests/${ARCH}.txt"
          for a in $PUBLISHED; do
            t=ghcr.io/otfabric/knx-interop-$a:${TAG#v}-${ARCH}
            docker push $t
            d=$(docker buildx imagetools inspect "$t" --format '{{.Manifest.Digest}}')
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $t"; exit 1; }
            echo "$a $d" | tee -a "digests/${ARCH}.txt"
          done
      - name: Upload the digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          if-no-files-found: error

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      # Each multi-arch tag is made from the digests the images job pushed,
      # never from the mutable <version>-<arch> tags; an image without both
      # digests stops the release.
      - name: Multi-arch tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          v=${TAG#v}
          : > digests.txt
          for a in $PUBLISHED; do
            i=ghcr.io/otfabric/knx-interop-$a
            refs=()
            for arch in amd64 arm64; do
              d=$(awk -v a="$a" '$1 == a { print $2 }' "digests/${arch}.txt" 2>/dev/null || true)
              [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no ${arch} digest for $a"; exit 1; }
              refs+=("$i@$d")
            done
            docker buildx imagetools create -t "$i:$v" "${refs[@]}"
            d=$(docker buildx imagetools inspect "$i:$v" --format '{{.Manifest.Digest}}')
            [[ "$d" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $i:$v"; exit 1; }
            echo "$a $d" | tee -a digests.txt
          done
      - name: Write manifest.json
        run: |
          set -euo pipefail
          scripts/release-manifest.py "${TAG}" "${GITHUB_SHA}" digests.txt manifest.json
          cat manifest.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/release-notes.sh "${TAG}" > notes.md && test -s notes.md
          gh release create "${TAG}" --title "knx-interop ${TAG}" --target "${GITHUB_SHA}" --notes-file notes.md manifest.json
