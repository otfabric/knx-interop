name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Lints the adapters, validates fixtures and versions, builds every adapter
# image natively on amd64 and arm64, smoke-tests each and runs the whole
# interoperability matrix of the third-party stacks on an isolated Docker
# network. OT Fabric's own stack has its own manual workflow
# (own-go-knx.yml); a system under test brings its own adapter image.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_REGISTRY: mirror.gcr.io/library

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y -qq shellcheck
      - run: make lint validate
      - name: No reference to a library under test
        # REQUIREMENTS.md R1: adapters, fixtures, scripts, schemas and tests
        # must not know any consumer. Documentation may name consumers as
        # examples; own/ is the one exception.
        run: |
          if grep -rInE 'go-knx|knxctl|goknx|otfabric/go-' adapters fixtures schemas scenarios scripts tests Makefile compose.yaml; then
            echo "::error::consumer-specific reference found"; exit 1
          fi

  matrix:
    name: Matrix (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          path: knx-interop
      - name: Build the adapter images
        working-directory: knx-interop
        run: make images
      - name: Smoke
        working-directory: knx-interop
        run: make smoke
      - name: Interoperability matrix
        working-directory: knx-interop
        run: make interop
      - name: Summary
        if: always()
        working-directory: knx-interop
        run: |
          [ -f reports/latest.md ] && cat reports/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-reports-${{ matrix.arch }}
          path: |
            knx-interop/reports/latest.*
            knx-interop/reports/results.json
          if-no-files-found: warn
