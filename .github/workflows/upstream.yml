name: Upstream
run-name: "Upstream check (${{ github.event_name }})"

# Daily check of every pin against the latest upstream release
# (scripts/latest-upstream.py: the Calimero images on Docker Hub, knxd in
# Debian trixie, xknx on PyPI, KNXUltimate on npm, knxctl on the Go module
# proxy) and of the digest of every base image. An adapter whose pin is behind
# is built at the latest release and the whole matrix runs with it, gated on
# that adapter (scripts/candidate.sh; once per pin -> latest pair, later runs
# reuse that result). The table goes to the Job Summary and to the issue
# "Upstream releases: pins behind the latest", which is opened or updated
# (with a comment when a new version shows up) and closed once every pin is
# current. Pins are never changed here: a bump is a reviewed change. probe is
# this repository's own tool and has no upstream. Shared steps:
# https://github.com/otfabric/.github/tree/main/actions
on:
  schedule:
    - cron: "31 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

env:
  BASE_REGISTRY: mirror.gcr.io/library

jobs:
  images:
    name: Base images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: otfabric/.github/actions/upstream-images@main

  candidate:
    name: ${{ matrix.adapter }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        adapter: [calimero-server, calimero-tools, knxd, xknx, knxultimate, goknx]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the pin against upstream
        id: resolve
        run: scripts/latest-upstream.py "${{ matrix.adapter }}" | tee -a "$GITHUB_OUTPUT"

      - name: Build and run the matrix at the latest release
        id: test
        if: steps.resolve.outputs.update == 'yes'
        uses: otfabric/.github/actions/upstream-candidate@main
        with:
          name: ${{ matrix.adapter }}
          pinned: ${{ steps.resolve.outputs.pin }}
          latest: ${{ steps.resolve.outputs.latest }}
          result-pattern: '^\[candidate\] [0-9]+ passed'
          # The matrix runs every adapter against the candidate: any recipe re-tests it.
          cache-paths: adapters fixtures tests scripts Makefile
          command: scripts/candidate.sh "${{ matrix.adapter }}" "${{ steps.resolve.outputs.latest }}"

      - name: Table row
        if: always()
        uses: otfabric/.github/actions/upstream-row@main
        with:
          component: ${{ matrix.adapter }}
          kind: ${{ steps.resolve.outputs.kind || 'library' }}
          source: ${{ steps.resolve.outputs.source }}
          pinned: ${{ steps.resolve.outputs.pin }}
          latest: ${{ steps.resolve.outputs.latest }}
          update: ${{ steps.resolve.outputs.update }}
          detail: ${{ steps.resolve.outcome == 'failure' && 'upstream lookup failed (see the job log)' || '' }}
          test-outcome: ${{ steps.test.outputs.outcome }}
          test-result: ${{ steps.test.outputs.result }}
          test-cached: ${{ steps.test.outputs.cached }}

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [images, candidate]
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - uses: otfabric/.github/actions/upstream-report@main
        with:
          needs: ${{ toJSON(needs) }}
          notes: |
            ### To update

            - **Image** (calimero-server, calimero-tools): the tag and digest in the
              adapter's `FROM`, its `VERSION` and comments, and `versions.yaml`.
            - **Package** (knxd): `ARG KNXD_VERSION` in `adapters/knxd/Dockerfile`, the Debian
              trixie version.
            - **Library:** xknx in `adapters/xknx/requirements.txt`, knxultimate in
              `adapters/knxultimate/package.json` and `package-lock.json`, goknx in
              `ARG KNXCTL_VERSION` of `adapters/goknx/Dockerfile` and the Makefile's `KNXCTL_VERSION`.
            - Every pin is also in `versions.yaml` and `scripts/check-versions.py`
              (`make validate`). Reproduce a candidate with `scripts/candidate.sh <adapter>
              <version>`; a `failure` needs the matrix report of the run first (a new deviation
              goes to `tests/known-differences.tsv` with its evidence).
            - **Base image:** replace the digest in `versions.yaml` and in every Dockerfile that pins it.
            - Record the change in `RELEASE.md`.
