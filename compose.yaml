# SPDX-License-Identifier: MIT
# Three KNXnet/IP servers and a shell on one isolated network, for
# exploring by hand (make images first):
#
#   docker compose up -d
#   docker compose run --rm xknx client read --target calimero --group 1/0/2 --dpt 9.001
#   docker compose run --rm otfabric client discover
#   docker compose down
#
# The automated matrix (scripts/run-matrix.py) creates its own networks.
name: knx-interop

x-image: &image
  pull_policy: never

services:
  calimero:
    <<: *image
    image: ghcr.io/otfabric/knx-interop-calimero-server:${VERSION:-dev}
    command: ["server", "--name", "calimero", "--routing"]
  knxd:
    <<: *image
    image: ghcr.io/otfabric/knx-interop-knxd:${VERSION:-dev}
    command: ["server", "--name", "knxd"]
  # OT Fabric's own stack (own/), pulled from GHCR: not a reference.
  otfabric-server:
    image: ${ADAPTER_IMAGE_otfabric:-ghcr.io/otfabric/knx-interop-otfabric:latest}
    command: ["server", "--name", "otfabric", "--routing"]
  # Clients, run with "docker compose run --rm <service> client ...".
  otfabric:
    image: ${ADAPTER_IMAGE_otfabric:-ghcr.io/otfabric/knx-interop-otfabric:latest}
    profiles: [client]
  xknx:
    <<: *image
    image: ghcr.io/otfabric/knx-interop-xknx:${VERSION:-dev}
    profiles: [client]
  knxultimate:
    <<: *image
    image: ghcr.io/otfabric/knx-interop-knxultimate:${VERSION:-dev}
    profiles: [client]
  cbsigma:
    <<: *image
    image: ghcr.io/otfabric/knx-interop-cbsigma:${VERSION:-dev}
    profiles: [client]
  # cB-Sigma knx-sim, the sim suite's gateway (not a contract server):
  #   docker compose --profile sim up -d knx-sim
  #   docker compose exec knx-sim /adapter/run sim-ctl stats
  knx-sim:
    <<: *image
    image: ghcr.io/otfabric/knx-interop-cbsigma:${VERSION:-dev}
    command: ["sim", "--secure"]
    profiles: [sim]
  calimero-tools:
    <<: *image
    image: ghcr.io/otfabric/knx-interop-calimero-tools:${VERSION:-dev}
    profiles: [client]
  probe:
    <<: *image
    image: ghcr.io/otfabric/knx-interop-probe:${VERSION:-dev}
    profiles: [client]

networks:
  default:
    driver: bridge
