# Machine-readable version manifest for knx-interop.
# Upstream pins and base image digests are release inputs; nothing floats.
# The Dockerfiles, adapters/xknx/requirements.txt and
# adapters/knxultimate/package-lock.json are the source of truth for a
# build: scripts/check-versions.py fails when this file disagrees with them.

interop_version: "0.8.1"
contract_version: "1.5"          # docs/CONTAINER_CONTRACT.md

protocol:
  name: "KNXnet/IP (core, tunnelling, routing), cEMI, KNX datapoint types"
  transport: "UDP on a user-defined Docker bridge network (multicast 224.0.23.12:3671 inside it)"

base_images:
  python: "python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df"
  node: "node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d"
  debian: "debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2"   # knxd, own/go-knx
  golang: "golang:1.27.2-trixie@sha256:e58d6f83b3416618d8bcac2b3dde1b7f7e3c4a77d25e88637f8bbae81536c48d"   # own/go-knx

implementations:
  calimero-server:
    status: implemented
    upstream: "calimero-project/calimero-server"
    repository: "https://github.com/calimero-project/calimero-server"
    version: "3.0-M1"
    image: "calimeroproject/knxserver:3.0-M1@sha256:70463ad74c4c976cbc8c062fc219b19059f417562051670deeaa65c5e13f7f9c"
    license: "GPL-2.0-only WITH Classpath-exception-2.0"
    language: "Java"
    stack: "Calimero (calimero-core)"
    roles: [server]
    note: "The official multi-arch image (amd64, arm64, armv7). 3.0-M2 (commit 5f162f26) exists as source and on Maven Central but has no image."
  calimero-tools:
    status: implemented
    upstream: "calimero-project/calimero-tools"
    repository: "https://github.com/calimero-project/calimero-tools"
    version: "3.0-M1"
    image: "calimeroproject/knxtools:3.0-M1@sha256:c83aa43c4a61f237104f08952d205cacab17d574040b46d5861b05cba4119966"
    license: "GPL-2.0-only WITH Classpath-exception-2.0"
    language: "Java"
    stack: "Calimero (calimero-core) — the same protocol engine as calimero-server"
    roles: [client]
  knxd:
    status: implemented
    upstream: "knxd/knxd"
    repository: "https://github.com/knxd/knxd"
    version: "0.14.73-1"           # Debian trixie package (upstream 0.14.75 is the latest tag)
    license: "GPL-2.0-only"
    language: "C++"
    stack: "knxd (eibnetserver, ipt/iptn/ip drivers) and knxtool"
    roles: [server, client]
  xknx:
    status: implemented
    upstream: "XKNX/xknx"
    repository: "https://github.com/XKNX/xknx"
    package: "xknx"
    version: "4.1.1"               # commit e3d8212777160af85ea2ecb4e5b9c01d7e600b03
    license: "MIT"
    language: "Python"
    stack: "xknx"
    roles: [client]
  knxultimate:
    status: implemented
    upstream: "Supergiovane/KNXUltimate"
    repository: "https://github.com/Supergiovane/KNXUltimate"
    package: "knxultimate"
    version: "6.3.2"               # commit cf104ba8122e2f42d3db032106808f98a1b6f215
    license: "MIT"
    language: "TypeScript (Node.js)"
    stack: "KNXUltimate"
    roles: [client]
  probe:
    status: implemented
    upstream: "otfabric/knx-interop"
    version: "1.0"
    license: "MIT"
    language: "Python (standard library)"
    stack: "hand-built datagrams for negative tests; shares no code with any stack"
    roles: [client]
  openhab:
    status: rejected
    upstream: "openhab/openhab-addons (org.openhab.binding.knx)"
    license: "EPL-2.0"
    note: "Embeds io.calimero:calimero-core 3.0-M2: not an independent implementation; needs a full openHAB runtime."

# OT Fabric's own stacks (own/, ADR-0012): published for others to test
# against, not references. Built by hand from the latest release (the "Own
# stack" workflow); not pinned here, not in a release.
own_implementations:
  otfabric:
    upstream: "go-knx"
    repository: "https://github.com/otfabric/go-knx"
    artifact: "go:github.com/otfabric/go-knx"
    version: "latest release, resolved when the image is built by hand"
    license: "MIT"
    language: "Go"
    independent_engine: false
    roles: [server, client]
    image: "ghcr.io/otfabric/knx-interop-otfabric"
    build: "own/go-knx"
